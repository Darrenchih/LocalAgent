[package]
name = "windows-ollama-agent-desktop"
version = "0.37.0"
description = "Windows-native Ollama Agent desktop shell"
edition = "2021"

[lib]
name = "windows_ollama_agent_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "windows-ollama-agent-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
sha2 = "0.10"
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_ProcessStatus"] }
